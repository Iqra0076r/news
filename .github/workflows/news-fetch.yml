name: Fetch news every 30 minutes

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newsroom-ingestion
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate scheduler secrets
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$SITE_URL" || (echo "Missing GitHub secret: SITE_URL" && exit 1)
          test -n "$CRON_SECRET" || (echo "Missing GitHub secret: CRON_SECRET" && exit 1)

      - name: Trigger protected newsroom ingestion
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --show-error --silent \
            --retry 3 --retry-all-errors --retry-delay 5 \
            --connect-timeout 15 --max-time 420 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${SITE_URL%/}/api/cron/news"
