name: Install Atlas Newsroom
on:
  push:
    paths:
      - '.atlas-bootstrap/**'
      - '.github/workflows/atlas-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-newsroom-bootstrap
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: https://example.com
      NEXT_PUBLIC_SITE_NAME: Atlas Newsroom
      DEMO_MODE: "true"
      AI_PROVIDER: openai
      OPENAI_MODEL: gpt-5.6
      CRON_SECRET: bootstrap-placeholder-secret
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: bootstrap-placeholder-password
      SESSION_SECRET: bootstrap-placeholder-session-secret
      NEWS_FEEDS_JSON: "[]"
    steps:
      - name: Checkout staged repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify Atlas package
        shell: bash
        run: |
          set -euo pipefail
          cat .atlas-bootstrap/part0.b64 .atlas-bootstrap/part1.b64 .atlas-bootstrap/part2.b64 .atlas-bootstrap/part3.b64 .atlas-bootstrap/part4.b64 | tr -d '\n\r ' | base64 --decode > /tmp/atlas-newsroom.tgz
          echo "16c55da0b470c0a7e854cd35ba5827e2cedc61f961704c5f59fae60ccbcfdea6  /tmp/atlas-newsroom.tgz" | sha256sum --check
          mkdir -p /tmp/atlas-newsroom
          tar -xzf /tmp/atlas-newsroom.tgz -C /tmp/atlas-newsroom
          test -f /tmp/atlas-newsroom/package.json
          test -f /tmp/atlas-newsroom/.github/workflows/news-fetch.yml
          test -f /tmp/atlas-newsroom/app/api/cron/news/route.ts

      - name: Validate new application
        working-directory: /tmp/atlas-newsroom
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Replace main with validated Atlas project
        shell: bash
        run: |
          set -euo pipefail
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/atlas-newsroom/. "$GITHUB_WORKSPACE"/
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Atlas Newsroom is already installed."
            exit 0
          fi
          git commit -m "feat: deploy Atlas autonomous newsroom"
          git push origin HEAD:main
