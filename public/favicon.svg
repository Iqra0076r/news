<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#dc2626"/>
  <g transform="translate(128, 96)">
    <!-- Newspaper body -->
    <rect x="0" y="0" width="256" height="320" rx="16" fill="white" opacity="0.95"/>
    <!-- Header bar -->
    <rect x="0" y="0" width="256" height="48" rx="16" fill="white"/>
    <rect x="0" y="16" width="256" height="32" fill="white"/>
    <rect x="24" y="12" width="80" height="24" rx="4" fill="#dc2626"/>
    <rect x="116" y="16" width="40" height="16" rx="3" fill="#e5e7eb"/>
    <rect x="164" y="16" width="68" height="16" rx="3" fill="#e5e7eb"/>
    <!-- Separator -->
    <rect x="24" y="56" width="208" height="2" rx="1" fill="#f3f4f6"/>
    <!-- Headline -->
    <rect x="24" y="72" width="180" height="20" rx="4" fill="#1f2937"/>
    <rect x="24" y="100" width="120" height="12" rx="3" fill="#9ca3af"/>
    <!-- Image placeholder -->
    <rect x="24" y="126" width="96" height="72" rx="8" fill="#fef2f2"/>
    <rect x="40" y="148" width="64" height="28" rx="4" fill="#fecaca"/>
    <!-- Text lines -->
    <rect x="136" y="126" width="96" height="10" rx="3" fill="#d1d5db"/>
    <rect x="136" y="144" width="88" height="10" rx="3" fill="#d1d5db"/>
    <rect x="136" y="162" width="72" height="10" rx="3" fill="#d1d5db"/>
    <rect x="136" y="180" width="96" height="10" rx="3" fill="#e5e7eb"/>
    <!-- More lines -->
    <rect x="24" y="214" width="208" height="10" rx="3" fill="#d1d5db"/>
    <rect x="24" y="232" width="180" height="10" rx="3" fill="#d1d5db"/>
    <rect x="24" y="250" width="196" height="10" rx="3" fill="#e5e7eb"/>
    <rect x="24" y="268" width="160" height="10" rx="3" fill="#e5e7eb"/>
    <!-- Bottom section -->
    <rect x="24" y="292" width="60" height="8" rx="3" fill="#fca5a5"/>
    <rect x="96" y="292" width="60" height="8" rx="3" fill="#fca5a5"/>
    <rect x="168" y="292" width="64" height="8" rx="3" fill="#fca5a5"/>
  </g>
</svg>
