<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <rect width="180" height="180" rx="40" fill="#dc2626"/>
  <g transform="translate(45, 33)">
    <!-- Newspaper body -->
    <rect x="0" y="0" width="90" height="114" rx="6" fill="white" opacity="0.95"/>
    <!-- Header bar -->
    <rect x="0" y="0" width="90" height="18" rx="6" fill="white"/>
    <rect x="0" y="6" width="90" height="12" fill="white"/>
    <rect x="8" y="4" width="30" height="10" rx="2" fill="#dc2626"/>
    <rect x="44" y="6" width="16" height="6" rx="1" fill="#e5e7eb"/>
    <rect x="64" y="6" width="22" height="6" rx="1" fill="#e5e7eb"/>
    <!-- Separator -->
    <rect x="8" y="22" width="74" height="1" rx="0.5" fill="#f3f4f6"/>
    <!-- Headline -->
    <rect x="8" y="28" width="64" height="7" rx="2" fill="#1f2937"/>
    <rect x="8" y="39" width="44" height="5" rx="1" fill="#9ca3af"/>
    <!-- Image placeholder -->
    <rect x="8" y="50" width="34" height="26" rx="3" fill="#fef2f2"/>
    <rect x="14" y="58" width="22" height="10" rx="2" fill="#fecaca"/>
    <!-- Text lines -->
    <rect x="50" y="50" width="34" height="4" rx="1" fill="#d1d5db"/>
    <rect x="50" y="58" width="30" height="4" rx="1" fill="#d1d5db"/>
    <rect x="50" y="66" width="24" height="4" rx="1" fill="#d1d5db"/>
    <rect x="50" y="74" width="34" height="4" rx="1" fill="#e5e7eb"/>
    <!-- More lines -->
    <rect x="8" y="84" width="74" height="4" rx="1" fill="#d1d5db"/>
    <rect x="8" y="92" width="64" height="4" rx="1" fill="#d1d5db"/>
    <rect x="8" y="100" width="68" height="4" rx="1" fill="#e5e7eb"/>
  </g>
</svg>
